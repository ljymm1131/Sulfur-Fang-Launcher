name: Build MiniLauncher (Windows)

on:
  workflow_dispatch:
  push:
    branches: [build/windows]

permissions:
  contents: read

env:
  SQLX_OFFLINE: 'true'
  RUST_MIN_STACK: '67108864'
  AXOLOTL_BUILD_PROFILE: ci

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(node -e 'const fs=require("node:fs");const s=fs.readFileSync("rust-toolchain.toml","utf8");const v=s.match(/^channel\s*=\s*"([^"]+)"/m)?.[1];if(!v||!/^\d+\.\d+\.\d+$/.test(v))process.exit(1);process.stdout.write(v);')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"

      - name: Setup Java (JDK 17 for Gradle resource build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup MSYS2 (Cubiomes seed-map compiler)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true

      - name: Install pinned GCC 16.2.0-6
        shell: msys2 {0}
        run: |
          set -euo pipefail
          gcc_version=16.2.0-6
          packages=(gcc gcc-libs libgcc 'libstdc++' cc-libs libatomic libgomp libquadmath)
          urls=()
          for package in "${packages[@]}"; do
            urls+=("https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-${package}-${gcc_version}-any.pkg.tar.zst")
          done
          pacman -U --noconfirm --needed "${urls[@]}"

      - name: Select native seed map compiler
        shell: pwsh
        run: |
          $compiler = Join-Path '${{ steps.setup-msys2.outputs.msys2-location }}' 'ucrt64/bin/gcc.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Seed map compiler is missing: $compiler" }
          $compilerDirectory = Split-Path -Parent $compiler
          $env:PATH = "$compilerDirectory;$env:PATH"
          & $compiler --version
          $compilerDirectory >> $env:GITHUB_PATH
          "AXOLOTL_CUBIOMES_CC=$compiler" >> $env:GITHUB_ENV

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build resources (Java + Blockbench skin)
        shell: bash
        env:
          AXOLOTL_BUILD_RESOURCES: ${{ github.workspace }}/target/build-resources
        run: node scripts/axolotl/prepare-build-resources.mjs --output "$AXOLOTL_BUILD_RESOURCES"

      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build desktop application (ci, unsigned)
        shell: bash
        env:
          AXOLOTL_BUILD_RESOURCES: ${{ github.workspace }}/target/build-resources
        run: |
          node scripts/axolotl/build-desktop.mjs --profile ci
          node scripts/axolotl/build-desktop.mjs --profile ci --installer-only

      - name: Package Windows installers (ci, unsigned)
        shell: bash
        run: node scripts/axolotl/package-windows.mjs --profile ci --output target/ci-installers

      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minilauncher-windows
          path: target/ci-installers/**
          if-no-files-found: error
          retention-days: 7
