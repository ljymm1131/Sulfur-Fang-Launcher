name: rebuild-macos-car

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --find actool

      - name: Rename icon layers to Sulfur Fang
        shell: bash
        run: |
          ICON="apps/app/icons/Axolotl.icon"
          ASSETS="$ICON/Assets"
          cp "$ASSETS/AXL(fixed).svg" "$ASSETS/SulfurFang.svg"
          rm "$ASSETS/AXL(fixed).svg"
          python3 - "$ICON/icon.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          for g in d.get("groups", []):
              for l in g.get("layers", []):
                  l["image-name"] = "SulfurFang.svg"
                  l["name"] = "Sulfur Fang"
          json.dump(d, open(p, "w"), indent=2)
          PY
          echo "--- icon.json ---"
          cat "$ICON/icon.json"

      - name: Compile .icon into Assets.car
        shell: bash
        run: |
          ICON="apps/app/icons/Axolotl.icon"
          OUT=/tmp/carout
          mkdir -p "$OUT"
          xcrun actool "$ICON" \
            --compile "$OUT" \
            --app-icon Icon \
            --platform macosx \
            --minimum-deployment-target 26.0 \
            --target-device mac \
            --include-all-app-icons \
            --enable-on-demand-resources NO \
            --development-region en \
            --output-partial-info-plist "$OUT/info.plist" 2>&1 | tee /tmp/actool.log
          echo "=== output ==="
          ls -la "$OUT"
          xcrun --sdk macosx assetutil --info "$OUT/Assets.car" > /tmp/new-car-info.json || true
          echo "=== asset names (should contain no AXL / Axolotl) ==="
          grep -aoE '"Name" : "[^"]+"' /tmp/new-car-info.json | sort -u | head -30 || true
          echo "=== leftover old names ==="
          grep -aoE 'AXL[^"]*|Axolotl[^"]*' "$OUT/Assets.car" | sort -u | head -10 || true

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sulfur-car-v2
          if-no-files-found: warn
          path: |
            /tmp/carout/Assets.car
            /tmp/carout/Icon.icns
            /tmp/actool.log
            /tmp/new-car-info.json
